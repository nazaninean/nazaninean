<svg width="640" height="400" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <clipPath id="frame2">
      <rect x="0" y="0" width="640" height="400" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame2)">
    <rect width="640" height="400" fill="#0d1117"/>
    <rect width="640" height="400" fill="none" stroke="#30363d" stroke-width="1"/>

    <rect x="0" y="0" width="640" height="34" fill="#161b22"/>
    <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="17" r="6" fill="#27c93f"/>
    <text x="320" y="21" fill="#8b949e" font-size="12" text-anchor="middle">nazaninean</text>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.1s" dur="0.4s" fill="freeze"/>
      <text x="24" y="66" font-size="16" fill="#8b949e">Hi <tspan font-size="16">&#128075;</tspan></text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.35s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.35s" dur="0.4s" fill="freeze"/>
      <text x="24" y="96" font-size="24" font-weight="700" fill="#e6edf3">I'm <tspan fill="url(#nameGrad)">Naza</tspan></text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.6s" dur="0.4s" fill="freeze"/>
      <text x="24" y="124" font-size="15" fill="#7ee787">&#8250; Computational Neuro &amp; Neurotech</text>
    </g>

    <!-- info rows, slide in from the left -->
    <g font-size="14">
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="0.85s" dur="0.35s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="-14 0" to="0 0" begin="0.85s" dur="0.35s" fill="freeze"/>
        <text x="24" y="160" fill="#8b949e">location</text>
        <text x="150" y="160" fill="#c9d1d9">Berkeley, CA &#183; Jakarta/Bandung (summers)</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.35s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="-14 0" to="0 0" begin="1.0s" dur="0.35s" fill="freeze"/>
        <text x="24" y="186" fill="#8b949e">education</text>
        <text x="150" y="186" fill="#c9d1d9">Cogsci and Data @ Berkeley</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1.15s" dur="0.35s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="-14 0" to="0 0" begin="1.15s" dur="0.35s" fill="freeze"/>
        <text x="24" y="212" fill="#8b949e">focus</text>
        <text x="150" y="212" fill="#c9d1d9">Computational Neuro &amp; Neurotech</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.35s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="-14 0" to="0 0" begin="1.3s" dur="0.35s" fill="freeze"/>
        <text x="24" y="238" fill="#8b949e">linkedin</text>
        <text x="150" y="238" fill="#58a6ff">linkedin.com/in/nazanine-nousafarin</text>
      </g>
    </g>

    <line x1="24" y1="260" x2="24" y2="260" stroke="#30363d" stroke-width="1">
      <animate attributeName="x2" from="24" to="616" begin="1.5s" dur="0.45s" fill="freeze"/>
    </line>

    <text x="24" y="286" font-size="13" fill="#8b949e" letter-spacing="1" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.95s" dur="0.3s" fill="freeze"/>
      SKILLS
    </text>

    <!-- skill pills, two rows, pop up + fade in -->
    <g font-size="13" fill="#c9d1d9">
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.05s" dur="0.3s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="2.05s" dur="0.3s" fill="freeze"/>
        <rect x="24" y="300" width="62" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
        <text x="55" y="317" text-anchor="middle">Python</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.12s" dur="0.3s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="2.12s" dur="0.3s" fill="freeze"/>
        <rect x="96" y="300" width="46" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
        <text x="119" y="317" text-anchor="middle">C++</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.19s" dur="0.3s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="2.19s" dur="0.3s" fill="freeze"/>
        <rect x="152" y="300" width="46" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
        <text x="175" y="317" text-anchor="middle">SQL</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.26s" dur="0.3s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="2.26s" dur="0.3s" fill="freeze"/>
        <rect x="208" y="300" width="96" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
        <text x="256" y="317" text-anchor="middle">MNE-Python</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.33s" dur="0.3s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="2.33s" dur="0.3s" fill="freeze"/>
        <rect x="314" y="300" width="110" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
        <text x="369" y="317" text-anchor="middle">scikit-learn</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.3s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="2.4s" dur="0.3s" fill="freeze"/>
        <rect x="24" y="336" width="58" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
        <text x="53" y="353" text-anchor="middle">NumPy</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.47s" dur="0.3s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="2.47s" dur="0.3s" fill="freeze"/>
        <rect x="92" y="336" width="58" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
        <text x="121" y="353" text-anchor="middle">SciPy</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.54s" dur="0.3s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="2.54s" dur="0.3s" fill="freeze"/>
        <rect x="160" y="336" width="96" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
        <text x="208" y="353" text-anchor="middle">H2O AutoML</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.61s" dur="0.3s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="2.61s" dur="0.3s" fill="freeze"/>
        <rect x="266" y="336" width="46" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
        <text x="289" y="353" text-anchor="middle">Git</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.68s" dur="0.3s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="2.68s" dur="0.3s" fill="freeze"/>
        <rect x="322" y="336" width="78" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
        <text x="361" y="353" text-anchor="middle">EEG/tDCS</text>
      </g>
    </g>

    <!-- blinking cursor -->
    <rect x="24" y="376" width="10" height="16" fill="#7ee787" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.01s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0;1" begin="2.9s" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- subtle ambient glow pulse behind the name, loops -->
    <circle cx="90" cy="88" r="70" fill="#22d3ee" opacity="0">
      <animate attributeName="opacity" values="0;0.06;0" begin="3.2s" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
